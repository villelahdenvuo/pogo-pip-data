name: Update game data

on:
  schedule:
    # Daily, after PvPoke's nightly game master and rankings update.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 build_data.py --cache "$RUNNER_TEMP/cache"
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          source=$(python3 -c "import json; print(json.load(open('v1/pokedata.json'))['source'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add v1
          git commit -m "Data: $source"
          git push
